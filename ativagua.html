<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Rápido: Água e Atividade de Água (Aw)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .quiz-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .quiz-header {
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 9999px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #38bdf8;
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #f1f5f9;
      margin-bottom: 20px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #334155;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px 16px;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #475569;
      border-color: #64748b;
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .feedback-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-box.correct-fb {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }

    .feedback-box.wrong-fb {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fecaca;
    }

    .feedback-title {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .next-btn {
      margin-top: 16px;
      width: 100%;
      background: #38bdf8;
      color: #082f49;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: background 0.2s ease;
    }

    .next-btn:hover {
      background: #7dd3fc;
    }

    .result-screen {
      text-align: center;
      display: none;
    }

    .result-score {
      font-size: 42px;
      font-weight: 800;
      color: #38bdf8;
      margin: 12px 0;
    }

    .result-msg {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .restart-btn {
      background: #10b981;
      color: #022c22;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .restart-btn:hover {
      background: #34d399;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- TELA DAS PERGUNTAS -->
    <div id="quiz-screen">
      <div class="quiz-header">
        <span class="badge">Broma / Quím. Alimentos • Água</span>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span id="question-counter" style="font-size: 12px; color: #94a3b8;">Pergunta 1 de 4</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <div id="question-text" class="question-title">Carregando pergunta...</div>

      <div id="options-container" class="options-container"></div>

      <div id="feedback-box" class="feedback-box">
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-text"></div>
      </div>

      <button id="next-btn" class="next-btn" onclick="nextQuestion()">Próxima Pergunta →</button>
    </div>

    <!-- TELA FINAL -->
    <div id="result-screen" class="result-screen">
      <span class="badge">Revisão Concluída</span>
      <h2 style="font-size: 22px; margin-top: 8px;">Excelente trabalho!</h2>
      <div id="result-score" class="result-score">0 / 4</div>
      <p id="result-msg" class="result-msg">Você revisou os conceitos de água livre, água ligada e atividade de água (Aw) nos alimentos.</p>
      <button class="restart-btn" onclick="restartQuiz()">Refazer Quiz de Água</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Qual é a principal diferença biológica e química entre 'Água Livre' e 'Água Ligada' na estrutura de um alimento?",
        options: [
          "A água ligada é a única responsável pelo crescimento de bactérias e bolores no alimento.",
          "A água livre está disponível para reações químicas/enzimáticas e microrganismos (medida como Aw), enquanto a ligada está unida a macromoléculas.",
          "A água livre não pode ser evaporada durante a secagem do alimento.",
          "A água ligada é medida diretamente pela Atividade de Água (Aw)."
        ],
        correct: 1,
        explanation: "A água livre está fracamente retida, disponível para reações e microrganismos (medida como Aw). A água ligada está intimamente unida às moléculas (proteínas, amido), não participa de reações e é estimada na umidade total."
      },
      {
        question: "O que o parâmetro 'Atividade de Água' (Aw) mede exatamente no alimento?",
        options: [
          "O percentual bruto total de gramas de água contidos na amostra.",
          "A quantidade de água endógena produzida pela respiração celular.",
          "A intensidade das forças que unem a água aos componentes não aquosos (disponibilidade de água).",
          "O ponto de ebulição exato da solução alimentar."
        ],
        correct: 2,
        explanation: "A Atividade de água (Aw) indica a intensidade das forças que unem a água com componentes não aquosos, mostrando a água realmente disponível para crescimento microbiano e reações."
      },
      {
        question: "Em relação ao crescimento microbiano e limites de Aw, qual grupo de microrganismos é mais exigente (necessita de maior Aw) e qual tolera ambientes com menor Aw?",
        options: [
          "Bolores necessitam de Aw alta (~0,97), enquanto bactérias crescem até em Aw de 0,60.",
          "Bactérias exigem maior Aw (a partir de ~0,91), enquanto bolores toleram Aw mais baixas (~0,70).",
          "Leveduras necessitam da menor Aw possível (Abaixo de 0,50).",
          "Todos os microrganismos param de crescer se a Aw for menor que 0,95."
        ],
        correct: 1,
        explanation: "As bactérias são as mais exigentes em água livre (maioria necessita de Aw ~0,91 ou mais). As leveduras toleram até ~0,88 e os bolores (fungos) são os mais resistentes, crescendo até em Aw ~0,70."
      },
      {
        question: "Sobre as fontes de água e suas interações com solutos nos alimentos, assinale a alternativa correta:",
        options: [
          "A água endógena é a proveniente exclusivamente da alimentação/ingestão exógena.",
          "A molécula de água é apolar, incapaz de dissolver compostos iônicos como NaCl.",
          "A água endógena origina-se de reações químicas no organismo (ex: síntese de proteínas, lipídios e respiração).",
          "Solutos carregados e cristalinos não sofrem hidratação ao interagir com as pontes de hidrogênio da água."
        ],
        correct: 2,
        explanation: "A água endógena é produzida no próprio organismo por reações químicas (síntese de macromoléculas e respiração)[cite: 2], enquanto a exógena vem da alimentação[cite: 2]. A água é polar e forma pontes de hidrogênio[cite: 3, 4]."
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-counter').innerText = `Pergunta ${currentQuestion + 1} de ${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestion) / questions.length) * 100}%`;
      document.getElementById('question-text').innerText = q.question;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      document.getElementById('feedback-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(index) {
      const q = questions[currentQuestion];
      const buttons = document.querySelectorAll('.option-btn');
      const feedbackBox = document.getElementById('feedback-box');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackText = document.getElementById('feedback-text');

      buttons.forEach(btn => btn.disabled = true);

      if (index === q.correct) {
        score++;
        buttons[index].classList.add('correct');
        feedbackBox.className = 'feedback-box correct-fb';
        feedbackTitle.innerHTML = '✓ Resposta Correta!';
      } else {
        buttons[index].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
        feedbackBox.className = 'feedback-box wrong-fb';
        feedbackTitle.innerHTML = '✕ Resposta Incorreta';
      }

      feedbackText.innerText = q.explanation;
      feedbackBox.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      document.getElementById('result-score').innerText = `${score} / ${questions.length}`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      loadQuestion();
    }

    // Inicializar
    loadQuestion();
  </script>
</body>
</html>
